# Builds the PhoneCam iPhone app on a free GitHub macOS runner.
# The result is an UNSIGNED PhoneCam.ipa (download it under the run's "Artifacts").
# Install it on the iPhone from Windows with Sideloadly, which signs it with your Apple ID.
name: Build iPhone app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project PhoneCam.xcodeproj \
            -scheme PhoneCam \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Check Info.plist
        working-directory: ios
        run: |
          plist=build/Build/Products/Release-iphoneos/PhoneCam.app/Info.plist
          plutil -p "$plist" | grep -A2 UIBackgroundModes | grep -q audio || { echo "UIBackgroundModes audio missing"; exit 1; }
          plutil -p "$plist" | grep -q NSMicrophoneUsageDescription || { echo "Microphone usage text missing"; exit 1; }

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneCam.app Payload/
          zip -qr PhoneCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-ipa
          path: ios/PhoneCam.ipa
          retention-days: 30
